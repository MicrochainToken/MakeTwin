name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests (Blender-dependent tests are skipped)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Viewer tests
        run: |
          for t in camera_math_test guide_player_test showcase_state_test explorer_state_test explorer_controller_test; do
            node tests/$t.cjs
          done
